<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
      var newBase = "https://mmasson003.perso.univ-pau.fr";
      var path = window.location.pathname.toLowerCase(); // Convert to lowercase for easier matching

      // 1. Check for specific video redirects
      if (path.includes("textbi")) {
        window.location.replace(newBase + "/videos/textbi.mp4");
      } 
      else if (path.includes("mobilityetl")) {
        window.location.replace(newBase + "/videos/etl.mp4");
      } 
      // 2. Everything else goes to the homepage
      else {
        window.location.replace(newBase + "/");
      }
    </script>
    
    <meta http-equiv="refresh" content="2; url=https://mmasson003.perso.univ-pau.fr/">
  </head>
  <body>
    <p>Redirecting to <a href="https://mmasson003.perso.univ-pau.fr/">our new site at UPPA</a>...</p>
  </body>
</html>
